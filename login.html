<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stone of Heimdall: sign in</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#f1e4c8;--fg:#3f2a18;--card:#f8f0dc;--mut:#7a5638;--ac:#7b502d;--onac:#fff;--bad:#a3322a;--ln:#d9c7a0}
@media(prefers-color-scheme:dark){:root{--bg:#1b130c;--fg:#ecd9b0;--card:#26190f;--mut:#b98b55;--ac:#d3a96e;--onac:#1b130c;--bad:#e8776a;--ln:#3a2a1a}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
form{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:20px;width:min(340px,90vw)}
h1{font-size:20px;margin:0}.brand{display:flex;gap:12px;align-items:center;margin:0 0 12px}.brand .mark{width:48px;height:48px;flex:none}.tag{color:var(--mut);font-size:12px}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
input{font:inherit;width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;margin-top:14px;width:100%;padding:9px;border:0;border-radius:8px;background:var(--ac);color:var(--onac);cursor:pointer}
.err{color:var(--bad);margin-top:10px}.note{color:var(--mut);font-size:12px;margin-top:14px;word-break:break-all}
</style></head><body>
<form method="post" action="/login" autocomplete="on">
<div class="brand"><img class="mark" src="/favicon.svg" alt=""><div><h1>Stone of Heimdall</h1><div class="tag">a watchman for your hotspot</div></div></div>
{{NOTE}}
<label for="u">Username</label><input id="u" name="user" autocomplete="username" autofocus required>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
<div class="err">{{ERR}}</div>
<div class="note">This page uses a self-signed certificate. Check that your browser's certificate fingerprint matches (SHA-256):<br>{{FP}}</div>
</form></body></html>
