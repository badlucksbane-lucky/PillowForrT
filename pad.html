<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pad</title>
<style>
:root{--bg:#16140f;--fg:#f1ebde;--mut:#9b9384;--card:#201d16;--line:#352f23;--acc:#d9b27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
#join{display:flex;flex-direction:column;gap:12px;padding:24px;max-width:420px;margin:0 auto;height:100%;justify-content:center}
input{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;user-select:text;-webkit-user-select:text}
input#cd{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:24px}
button{padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font:inherit;font-weight:700}
#root{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#root[hidden],#join[hidden]{display:none}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top .mut{margin-left:auto;color:var(--mut)}
.dot{width:14px;height:14px;border-radius:50%}
.area{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;padding:8px 14px 24px;gap:12px;min-height:0}
.area.solo{grid-template-columns:1fr}
.left,.right{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0;gap:14px}
.stick{width:min(44vw,44vh,240px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);position:relative;touch-action:none}
.stick.dpad{border-radius:28%}
.knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:var(--acc);opacity:.85;pointer-events:none}
.pointer{width:100%;height:100%;border:2px solid var(--line);border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--mut);touch-action:none}
.buttons{display:grid;grid-template-columns:repeat(2,auto);gap:16px}
.buttons.n1{grid-template-columns:auto}
.btn{width:min(26vw,22vh,120px);aspect-ratio:1;border-radius:50%;font-size:28px;background:var(--card);color:var(--fg);border:2px solid var(--line);touch-action:none}
.btn.on{background:var(--acc);color:var(--bg)}
@media (orientation:portrait){ /* thumbs sit at the bottom: sticks and buttons low, a pointer pad takes the space above them */
  .area{align-items:end}
  .left,.right{height:auto}
  .area.ptr{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .area.ptr .left{height:100%}
  .btn{width:min(20vw,96px)}
}
.tiltbtn{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:70%;overflow:auto;padding:14px;background:var(--bg);border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.panel[hidden],.veil[hidden]{display:none}
.ptitle{font-weight:800;text-align:center}
.pick{background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:20px;padding:18px}
.pick.chosen{background:var(--acc);color:var(--bg)}
.pick:disabled{opacity:.5}
.veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(22,20,15,.92);font-size:28px;font-weight:800;text-align:center;padding:24px;border:8px solid var(--line)}
</style>
</head>
<body>
<div id="join">
  <input id="nm" placeholder="Name" maxlength="16" autocomplete="off">
  <input id="cd" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters">
  <button id="go">Join</button>
</div>
<div id="root" hidden></div>
<script src="/room/room.js"></script>
<script src="/game/pad.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
let pad=null;
try{$('#nm').value=localStorage.getItem('pad:name')||''}catch(e){}
function start(code){
  const name=$('#nm').value.trim()||'Player';
  try{localStorage.setItem('pad:name',name)}catch(e){}
  $('#join').hidden=true;$('#root').hidden=false;
  pad=new Pad({root:$('#root'),name,code});window.pad=pad; // window.pad is for the tests and for poking at from the console
}
$('#go').onclick=()=>{const c=$('#cd').value.trim().toUpperCase();if(c.length===4)start(c)};
// A scanned link (#CODE) fills the code in and waits for a tap (a tap is what lets the phone vibrate and keep its screen on); a reload returns to the same place at once.
function fromHash(){
  const h=location.hash.slice(1);
  if(!/^[A-Za-z]{4}$/.test(h))return false;
  $('#cd').value=h.toUpperCase();history.replaceState(null,'',location.pathname);return true;
}
window.addEventListener('hashchange',()=>{if(fromHash()&&pad){pad.leave();pad=null;$('#root').hidden=true;$('#join').hidden=false}});
if(!fromHash()){const s=Room.saved();if(s&&s.code)start(s.code)}
</script>
</body>
</html>
