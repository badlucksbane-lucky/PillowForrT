<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room spike</title>
<style>
:root{--bg:#fbf7ef;--fg:#1d1b17;--mut:#7a7366;--card:#fff;--line:#e5dccb;--ok:#2e7d32;--bad:#b3261e;--acc:#6b4f2a}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#f1ebde;--mut:#9b9384;--card:#201d16;--line:#352f23;--ok:#7bd88f;--bad:#ff8a80;--acc:#d9b27a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:18px;margin:0 0 12px}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;text-transform:uppercase}
input#nm{text-transform:none}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);font:inherit;font-weight:600}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#code{font-size:44px;font-weight:800;letter-spacing:.2em;text-align:center;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:28px;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.grid div{padding:8px;border:1px solid var(--line);border-radius:10px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:0}
</style>
</head>
<body>
<h1>Room spike</h1>
<div id="join">
  <div class="row"><input id="nm" placeholder="This device" maxlength="24"></div>
  <div class="row"><button id="mk">New room</button><input id="cd" placeholder="CODE" maxlength="4" autocapitalize="characters"><button class="g" id="jn">Join</button></div>
</div>
<div id="room" hidden>
  <div id="code" aria-label="Room code"></div>
  <div class="mut" id="me" style="text-align:center"></div>
  <div id="peers"></div>
  <div class="row"><button id="again">Run again</button><button class="g" id="copy">Copy report</button></div>
  <pre id="rep" class="mut"></pre>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nm=$('#nm');try{nm.value=localStorage.getItem('rs:name')||''}catch(e){}
if(!nm.value)nm.value=/Android/.test(navigator.userAgent)?'Android':/iPhone|iPad/.test(navigator.userAgent)?'iPhone':'Computer';
const peers=new Map();let ws,me='',roomCode='',hb=0;
const ICE_WAIT=10000,PINGS=20;

function start(code){
  try{localStorage.setItem('rs:name',nm.value)}catch(e){}
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/room');
  ws.onopen=()=>{ws.send(JSON.stringify({t:'join',room:code,name:nm.value.trim()||'device'}));hb=setInterval(()=>ws.readyState===1&&ws.send('{"t":"ping"}'),30000)};
  ws.onmessage=e=>onBox(JSON.parse(e.data));
  ws.onclose=()=>{clearInterval(hb);$('#me').textContent='Box connection closed'};
}
function sig(to,d){ws.send(JSON.stringify({t:'to',to,d}))}
function onBox(m){
  if(m.t==='err'){alert(m.m);return}
  if(m.t==='hello'){me=m.id;roomCode=m.room;$('#join').hidden=true;$('#room').hidden=false;$('#code').textContent=m.room;$('#me').textContent='You are '+nm.value+' ('+me+')';
    m.peers.forEach(p=>connect(p,true));draw()}
  else if(m.t==='join'){peers.set(m.id,mk(m));draw()}
  else if(m.t==='leave'){const p=peers.get(m.id);if(p&&p.pc)p.pc.close();peers.delete(m.id);draw()}
  else if(m.t==='from')onSig(m.from,m.d);
}
function mk(p){return {id:p.id,name:p.name,pc:null,ch:null,state:'waiting',cand:[],pair:'',ms:0,rtt:null,relay:null,t0:0,q:Promise.resolve(),pend:{}}}
function connect(info,init){
  const P=peers.get(info.id)||mk(info);peers.set(info.id,P);P.t0=performance.now();P.state='connecting';
  const pc=P.pc=new RTCPeerConnection({iceServers:[]}); // no STUN: this is the LAN, and the box may have no internet
  pc.onicecandidate=e=>{if(e.candidate){P.cand.push(e.candidate.candidate);sig(P.id,{ice:e.candidate});draw()}};
  pc.onconnectionstatechange=async()=>{
    if(pc.connectionState==='connected'&&!P.ms){P.ms=Math.round(performance.now()-P.t0);P.state='connected';await pair(P)}
    else if(pc.connectionState==='failed')P.state='failed';
    draw()};
  pc.ondatachannel=e=>chan(P,e.channel);
  setTimeout(()=>{if(P.state==='connecting'){P.state='failed';draw();relayTest(P)}},ICE_WAIT);
  if(init){chan(P,pc.createDataChannel('u',{ordered:false,maxRetransmits:0}));
    P.q=P.q.then(async()=>{await pc.setLocalDescription(await pc.createOffer());sig(P.id,{sdp:pc.localDescription})})}
  draw();return P;
}
function onSig(from,d){
  if(d.rp!==undefined){const P=peers.get(from)||null;if(from===me&&relayWait.has(d.rp)){relayWait.get(d.rp)(performance.now());relayWait.delete(d.rp)}return}
  let P=peers.get(from);if(!P)return;
  if(!P.pc&&d.sdp)P=connect(P,false);
  const pc=P.pc;if(!pc)return;
  P.q=P.q.then(async()=>{
    if(d.sdp){await pc.setRemoteDescription(d.sdp);if(d.sdp.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());sig(P.id,{sdp:pc.localDescription})}}
    else if(d.ice)await pc.addIceCandidate(d.ice)
  }).catch(e=>{P.err=String(e)});
}
function chan(P,ch){
  P.ch=ch;ch.onopen=()=>{test(P)};
  ch.onmessage=e=>{const s=String(e.data);if(s[0]==='p')ch.send('q'+s.slice(1));else if(s[0]==='q'&&P.pw&&P.pw.has(s)){P.pw.get(s)(performance.now());P.pw.delete(s)}};
}
async function pair(P){
  try{const st=await P.pc.getStats(),all={};st.forEach(r=>all[r.id]=r);
    const t=[...st.values()].find(r=>r.type==='transport'&&r.selectedCandidatePairId),cp=t&&all[t.selectedCandidatePairId];
    if(cp){const l=all[cp.localCandidateId]||{},r=all[cp.remoteCandidateId]||{};P.pair=(l.candidateType||'?')+' / '+(r.candidateType||'?')+' '+(l.protocol||'')}}catch(e){}
}
function stats(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);return {min:Math.round(s[0]),med:Math.round(s[s.length>>1]),p95:Math.round(s[Math.min(s.length-1,Math.floor(s.length*.95))])}}
async function test(P){
  P.pw=new Map();const rtts=[];let lost=0;
  for(let i=0;i<PINGS;i++){
    const k=String(i),t0=performance.now();
    const got=new Promise(ok=>{P.pw.set('q'+k,t=>ok(t-t0));setTimeout(()=>{P.pw.delete('q'+k);ok(-1)},800)});
    if(P.ch.readyState!=='open')break;P.ch.send('p'+k);
    const v=await got;v<0?lost++:rtts.push(v);await sleep(60);
  }
  P.rtt=stats(rtts);P.lost=lost;draw();relayTest(P);
}
const relayWait=new Map();let rn=0;
async function relayTest(P){
  const r=[];let lost=0;
  for(let i=0;i<PINGS;i++){
    const k=++rn,t0=performance.now();
    const got=new Promise(ok=>{relayWait.set(k,t=>ok(t-t0));setTimeout(()=>{relayWait.delete(k);ok(-1)},1500)});
    sig(me,{rp:k});const v=await got;v<0?lost++:r.push(v);await sleep(60);
  }
  P.relay=stats(r);P.rlost=lost;draw();
}
function types(P){const c={host:0,srflx:0,relay:0,mdns:0};
  P.cand.forEach(s=>{const m=/ typ (\w+)/.exec(s),a=s.split(' ')[4]||'';if(m)c[m[1]]=(c[m[1]]||0)+1;if(a.endsWith('.local'))c.mdns++});
  return c.host+' host ('+c.mdns+' hidden as .local)'+(c.srflx?', '+c.srflx+' srflx':'')+(c.relay?', '+c.relay+' relay':'')}
function ms(s,lost,n){return s?s.med+' ms':'—'}
function draw(){
  const box=$('#peers');box.replaceChildren();
  if(!peers.size){const d=document.createElement('div');d.className='mut';d.style.textAlign='center';d.textContent='Waiting for another device. Open this page there and join '+roomCode;box.append(d)}
  peers.forEach(P=>{
    const c=document.createElement('div');c.className='card';
    const h=document.createElement('div');h.className='big '+(P.state==='connected'?'ok':P.state==='failed'?'bad':'');
    h.textContent=P.name+' · '+(P.state==='connected'?'direct ok':P.state==='failed'?'direct failed':P.state);
    const g=document.createElement('div');g.className='grid';
    [['Direct',ms(P.rtt)+(P.lost?' ('+P.lost+' lost)':'')],['Via box',ms(P.relay)+(P.rlost?' ('+P.rlost+' lost)':'')],['Connect',P.ms?P.ms+' ms':'—'],['Path',P.pair||'—']].forEach(([a,b])=>{
      const d=document.createElement('div');const s=document.createElement('div');s.className='mut';s.textContent=a;const v=document.createElement('b');v.textContent=b;d.append(s,v);g.append(d)});
    const m=document.createElement('div');m.className='mut';m.style.marginTop='8px';m.textContent=types(P)+(P.err?' · '+P.err:'');
    c.append(h,g,m);box.append(c)});
  $('#rep').textContent=JSON.stringify(report(),null,1);
}
function report(){return {ua:navigator.userAgent,room:roomCode,me:nm.value,peers:[...peers.values()].map(P=>({name:P.name,state:P.state,connectMs:P.ms,pair:P.pair,candidates:types(P),direct:P.rtt,directLost:P.lost,viaBox:P.relay,viaBoxLost:P.rlost,err:P.err||''}))}}
$('#mk').onclick=()=>start('');
$('#jn').onclick=()=>{const c=$('#cd').value.trim().toUpperCase();if(c.length===4)start(c)};
$('#again').onclick=()=>peers.forEach(P=>{if(P.ch&&P.ch.readyState==='open')test(P);else relayTest(P)});
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#rep').textContent);$('#copy').textContent='Copied'}catch(e){$('#copy').textContent='Select the text'}setTimeout(()=>$('#copy').textContent='Copy report',1500)};
const h=location.hash.slice(1);if(/^[A-Za-z]{4}$/.test(h))$('#cd').value=h.toUpperCase();
</script>
</body>
</html>
