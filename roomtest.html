<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room spike</title>
<style>
:root{--bg:#fbf7ef;--fg:#1d1b17;--mut:#7a7366;--card:#fff;--line:#e5dccb;--ok:#2e7d32;--bad:#b3261e;--acc:#6b4f2a}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#f1ebde;--mut:#9b9384;--card:#201d16;--line:#352f23;--ok:#7bd88f;--bad:#ff8a80;--acc:#d9b27a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:18px;margin:0 0 12px}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;text-transform:uppercase}
input#nm{text-transform:none}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);font:inherit;font-weight:600}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#code{font-size:44px;font-weight:800;letter-spacing:.2em;text-align:center;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:28px;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.grid div{padding:8px;border:1px solid var(--line);border-radius:10px}
.tile{background:#fff;border-radius:12px;max-width:240px;margin:0 auto;line-height:0;overflow:hidden}
.tile svg{width:100%;height:auto}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:0}
</style>
</head>
<body>
<h1>Room spike</h1>
<div id="join">
  <div class="row"><input id="nm" placeholder="This device" maxlength="24"></div>
  <div class="row"><button id="mk">New room</button><input id="cd" placeholder="CODE" maxlength="4" autocapitalize="characters"><button class="g" id="jn">Join</button></div>
</div>
<div id="room" hidden>
  <div id="code" aria-label="Room code"></div>
  <div class="card" id="qr" style="text-align:center"></div>
  <div class="mut" id="me" style="text-align:center"></div>
  <div id="peers"></div>
  <div class="row"><button id="again">Run again</button><button class="g" id="copy">Copy report</button><button class="g" id="leave">Leave</button></div>
  <pre id="rep" class="mut"></pre>
</div>
<script src="/room/qr.js"></script>
<script src="/room/room.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const nm=$('#nm');try{nm.value=localStorage.getItem('rs:name')||''}catch(e){}
if(!nm.value)nm.value=/Android/.test(navigator.userAgent)?'Android':/iPhone|iPad/.test(navigator.userAgent)?'iPhone':'Computer';
const res=new Map(); // peer id -> {direct, relay, box}
let room=null;

function start(code){
  try{localStorage.setItem('rs:name',nm.value)}catch(e){}
  const s=Room.saved();
  room=new Room({name:nm.value.trim()||'device',code:code||(s&&s.code)||''});window.room=room; // window.room is for the tests and for poking at from the console
  room.on('ready',r=>{$('#join').hidden=true;$('#room').hidden=false;$('#code').textContent=r.code;drawQR();draw();measureAll()});
  room.on('peer',draw).on('peerleft',draw).on('link',p=>{draw();if(p.state==='direct'||p.state==='relay')measure(p.id)}).on('status',draw);
  room.on('closed',c=>{$('#join').hidden=false;$('#room').hidden=true;room=null;if(c.reason!=='left')alert(c.reason)});
}
function drawQR(){
  const url=room.joinUrl(),box=$('#qr'),tile=document.createElement('div');tile.className='tile';tile.id='tile';
  tile.innerHTML=QR.svg(url,{scale:5}); // our own markup: the origin of this page and a 4-letter code
  const row=document.createElement('div');row.className='row';row.style.cssText='margin:12px 0 0;justify-content:center';
  const cp=document.createElement('button');cp.className='g';cp.id='copylink';cp.textContent='Copy link';
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(url);cp.textContent='Copied'}catch(e){cp.textContent=url}setTimeout(()=>cp.textContent='Copy link',1500)};
  row.append(cp);
  if(navigator.share){const sh=document.createElement('button');sh.className='g';sh.id='sharelink';sh.textContent='Share';sh.onclick=()=>navigator.share({title:'Join my room',url}).catch(()=>{});row.append(sh)}
  box.replaceChildren(tile,row);
}
async function measure(id){
  const rm=room;
  if(!rm||!rm.peers.get(id))return;
  const r=res.get(id)||{};if(r.running)return;
  r.running=true;res.set(id,r);
  try{
    if(rm.peers.get(id)&&rm.peers.get(id).state==='direct')r.direct=await rm.rtt(id,'direct');
    r.relay=await rm.rtt(id,'relay');r.box=await rm.rtt(id,'box');
  }finally{r.running=false}
  if(room===rm)draw();
}
function measureAll(){if(room)room.peers.forEach(p=>{if(p.state==='direct'||p.state==='relay')measure(p.id)})}
const f=s=>s&&s.med!==null?s.med+' ms'+(s.lost?' ('+s.lost+' lost)':''):'—';
function draw(){
  if(!room)return;
  $('#me').textContent='You are '+room.name+' ('+room.id+') · '+room.status;
  const box=$('#peers');box.replaceChildren();
  if(!room.peers.size){const d=document.createElement('div');d.className='mut';d.style.textAlign='center';d.textContent='Waiting for another device';box.append(d)}
  room.peers.forEach(p=>{
    const r=res.get(p.id)||{},c=document.createElement('div');c.className='card';
    const h=document.createElement('div');h.className='big '+(p.state==='direct'?'ok':p.state==='relay'||p.state==='away'?'bad':'');
    h.textContent=p.name+' · '+p.state;
    const g=document.createElement('div');g.className='grid';
    [['Direct',f(r.direct)],['Via box (to them)',f(r.relay)],['To box and back',f(r.box)],['Route',p.state]].forEach(([a,b])=>{
      const d=document.createElement('div'),s=document.createElement('div');s.className='mut';s.textContent=a;const v=document.createElement('b');v.textContent=b;d.append(s,v);g.append(d)});
    c.append(h,g);box.append(c)});
  $('#rep').textContent=JSON.stringify(report(),null,1);
}
function report(){return {ua:navigator.userAgent,room:room&&room.code,me:room&&room.name,status:room&&room.status,peers:room?[...room.peers.values()].map(p=>{const r=res.get(p.id)||{};return {name:p.name,state:p.state,direct:r.direct,viaBox:r.relay,toBox:r.box}}):[]}}
$('#mk').onclick=()=>start('');
$('#jn').onclick=()=>{const c=$('#cd').value.trim().toUpperCase();if(c.length===4)start(c)};
$('#again').onclick=()=>{res.clear();measureAll()};
$('#leave').onclick=()=>{if(room)room.leave()};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#rep').textContent);$('#copy').textContent='Copied'}catch(e){$('#copy').textContent='Select the text'}setTimeout(()=>$('#copy').textContent='Copy report',1500)};
// A scanned or shared link (#CODE): join at once, then drop the code from the address so a reload does not use a stale one. A tab that is already on this page only gets a new fragment (no
// reload), so this also runs on hashchange, and it switches rooms if the page is in another one.
function fromHash(){
  const h=location.hash.slice(1);
  if(!/^[A-Za-z]{4}$/.test(h))return false;
  const c=h.toUpperCase();history.replaceState(null,'',location.pathname);
  if(room&&room.code===c)return true;
  if(room)room.leave();
  $('#cd').value=c;start(c);return true;
}
window.addEventListener('hashchange',fromHash);
if(!fromHash()&&Room.saved())start(Room.saved().code); // a reload comes back to the same place
</script>
</body>
</html>
