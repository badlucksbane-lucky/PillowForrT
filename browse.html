 el.addEventListener('touchend',e=>{if(!on)return;on=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.7&&Date.now()-t0<1000&&(!edge||(dx<0?edge.end:edge.start)))fn(dx)},{passive:true})}
hswipe($('#main'),dx=>{if(sheet.classList.contains('open'))return;const i=TABS.indexOf(S.tab)+(dx<0?1:-1);if(i>=0&&i<TABS.length)go({tab:TABS[i],c:'',g:'',q:''})});
// a carousel scrolls sideways itself; a swipe only changes the tab once the carousel under the finger is at its edge
(()=>{let y0=0,dy=0,on=false,t0=0;panel.addEventListener('touchstart',e=>{on=panel.scrollTop<=0&&e.touches.length===1;if(on){y0=e.touches[0].clientY;dy=0;t0=Date.now()}},{passive:true});
 panel.addEventListener('touchmove',e=>{if(!on)return;dy=e.touches[0].clientY-y0;if(dy>8){panel.classList.add('drag');panel.style.transform='translateY('+Math.max(0,dy-8)+'px)';if(e.cancelable)e.preventDefault()}else if(dy<0){on=false;panel.classList.remove('drag');panel.style.transform=''}},{passive:false});
 panel.addEventListener('touchend',()=>{if(!on)return;on=false;panel.classList.remove('drag');const v=dy/(Date.now()-t0+1);if(dy>120||(dy>50&&v>.5)){panel.style.transform='translateY(102%)';setTimeout(closeSheet,160)}else panel.style.transform=''},{passive:true})})();
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&playerEl.classList.contains('open'))closePlayer();else if(e.key==='Escape'&&sheet.classList.contains('open'))closeSheet();else if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});
// ---------- render ----------
function indicator(dir){const b=$('#tabs [data-t="'+S.tab+'"]'),ind=$('#ind');ind.style.width=b.offsetWidth*.5+'px';ind.style.transform='translateX('+(b.offsetLeft+b.offsetWidth*.25)+'px)'}
function render(force){const p=parse(),prevTab=S.tab,key=p.tab+'|'+p.c+'|'+p.g+'|'+p.q,hadSheet=!!S.id;
 if(p.id&&!hadSheet&&S.key)S.fromApp=true;if(!p.id)S.fromApp=false;
 Object.assign(S,p);
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===S.tab));indicator();
 const qi=$('#q');if(document.activeElement!==qi)qi.value=S.q;qi.placeholder={movies:'Search movies',series:'Search series',anime:'Search anime',web:'Search the web'}[S.tab];
 if(force||key!==S.key){S.key=key;const rid=++S.rid,pane=h('div',{class:'pane'+(prevTab!==S.tab?(TABS.indexOf(S.tab)>TABS.indexOf(prevTab)?' inL':' inR'):'')});$('#main').replaceChildren(pane);window.scrollTo(0,0);S.tab==='web'?renderWeb(pane,rid):renderBrowse(pane,rid)}
 if(S.id){const sid=++S.sid;renderSheet(sid)}else if(hadSheet||sheet.classList.contains('open')){++S.sid;showSheet(false)}}
$('#sf').addEventListener('submit',e=>{e.preventDefault();const q=$('#q').value.trim();$('#q').blur();go({q,g:'',c:''})});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.t!==S.tab)go({tab:b.dataset.t,c:'',g:'',q:''})});
window.addEventListener('hashchange',()=>render());window.addEventListener('resize',indicator);
btStatus();render(true);
})();
